<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta de campeones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: game-night lobby, punchy and clear, Spanish rioplatense.
   IDEA: a three-seat slot machine at the edge of the Rift — each seat spins its own three reels.
   PICTURE: the three player cards with their reels, landing one by one.
   COLOUR and TYPE: deep rift teal ground, three seat colours (cyan, coral, lime); Cinzel for names, Barlow for UI.
   LAYOUT: modest title + room bar, three cards in a row (stacked on phones), big spin button under them. */
:root{color-scheme:dark;--bg:#0a1c21;--bg2:#0f2a30;--card:#11303700;--line:#22505a;--ink:#e9f4f2;--mute:#9bbab8;
--p1:#3fe0d3;--p2:#ff8170;--p3:#d6ef5c;--gold:#f3d27a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 520px at 50% -120px,#17474d 0%,transparent 70%),linear-gradient(#0a1c21,#071418);background-color:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.band{padding:clamp(22px,4vw,48px) max(5vw,16px);max-width:1240px;margin:0 auto}
h1{font:700 clamp(30px,5vw,46px)/1.05 Cinzel,Georgia,serif;margin:0;text-wrap:balance;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:22px}
.sub{color:var(--mute);margin:6px 0 0}
.roombar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roombar label{color:var(--mute);font-size:14px}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:#0b2228;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#code{width:13ch}
button{font:600 15px/1 Barlow,sans-serif;color:var(--ink);background:#163a41;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover:not(:disabled){background:#1c4952}
button:disabled{opacity:.45;cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#6b7f80}
.dot.on{background:#5ee08a;box-shadow:0 0 10px #5ee08a}
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
#nick{width:min(260px,100%)}
.seats{display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.seat{--c:var(--p1);background:linear-gradient(180deg,#12333a,#0d252b);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;box-shadow:0 18px 40px -24px #000}
.seat[data-s="2"]{--c:var(--p2)}.seat[data-s="3"]{--c:var(--p3)}
.seat.mine{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 18px 50px -20px color-mix(in srgb,var(--c) 55%,transparent)}
.seat header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 18px Cinzel,serif;color:#062024;background:var(--c)}
.who{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:13px;color:var(--mute)}
.seat header>div{flex:1}
.sit{flex:none;font-size:14px}
.reels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{width:100%;min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:8px 14px;border-radius:12px;background:#081a1f;border:1px solid #1b4048;position:relative;overflow:hidden}
.slot .nm{font:700 clamp(17px,2vw,21px)/1.15 Cinzel,Georgia,serif;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .mk{font-size:13px;color:var(--c);display:none}
.slot.rolling .nm{color:var(--mute);filter:blur(.4px)}
.slot.land{animation:land .35s ease-out}
.slot.picked{background:color-mix(in srgb,var(--c) 18%,#081a1f);border-color:var(--c)}
.slot.picked .mk{display:block}
.slot.empty .nm{color:#4d6d70}
.seat:not(.mine) .slot{cursor:default}
.seat:not(.mine) .slot:hover{background:#081a1f}
.seat.mine .slot:not(.empty):not(.picked):hover{border-color:var(--c)}
@keyframes land{0%{transform:translateY(-8px);box-shadow:0 0 0 2px var(--c)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.go{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 6px}
#spin{font:700 clamp(20px,3vw,26px)/1 Cinzel,serif;min-height:68px;padding:0 44px;border-radius:999px;color:#062024;border:0;background:linear-gradient(180deg,#ffe7a3,var(--gold) 55%,#c99c3c);box-shadow:0 10px 30px -10px #f3d27a99,inset 0 -3px 0 #00000030}
#spin:hover:not(:disabled){background:linear-gradient(180deg,#fff0c4,#f7dc8f 55%,#d4a748)}
#msg{min-height:1.5em;color:var(--mute);text-align:center;font-size:15px}
#msg.warn{color:var(--p2)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.opts{display:grid;gap:12px;margin-top:10px}
.chk{display:flex;gap:10px;align-items:center}
.chk input{width:20px;height:20px}
textarea{width:100%;min-height:160px;font-size:15px;line-height:1.5}
.hint{font-size:14px;color:var(--mute);margin:0}
@media(max-width:820px){.seats{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.slot.land{animation:none}}

/* turnos y confirmación */
.seat .online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5c7375;margin-right:6px;vertical-align:1px}
.seat.on .online{background:#5ee08a;box-shadow:0 0 8px #5ee08a}
.seat.turn::before{content:"Le toca";position:absolute;top:-11px;right:16px;font:700 12px/1 Barlow,sans-serif;letter-spacing:.02em;color:#062024;background:var(--gold);padding:5px 10px;border-radius:999px}
.seat.turn{border-color:var(--gold)}
.seat.mine.turn{box-shadow:0 0 0 1px var(--gold),0 18px 50px -20px #f3d27a80}
.panel{margin:26px auto 6px;max-width:620px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.panel .big{font:700 clamp(20px,2.6vw,24px)/1.2 Cinzel,Georgia,serif;margin:0;text-wrap:balance}
.panel .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.panel .small{color:var(--mute);margin:0;font-size:15px}
.yes{background:#1e5a3a;border-color:#2f8a57}.yes:hover:not(:disabled){background:#246b45}
.no{background:#5a2626;border-color:#8a3a3a}.no:hover:not(:disabled){background:#6b2d2d}
.round{color:var(--mute);font-size:14px}
.claimbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.claimbar .tag{margin-right:4px}
.rolerow{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:14px;color:var(--mute)}
select{font:inherit;font-size:16px;color:var(--ink);background:#0b2228;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px}
select:disabled{opacity:.8;cursor:default}
.build{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.build[hidden]{display:none}
.build h3{margin:0 0 2px;font:700 16px/1.25 Cinzel,Georgia,serif;color:var(--c)}
.build .bk{font-size:13px;color:var(--mute);margin:0 0 8px}
.build .note{margin:0 0 8px;font-size:15px}
.build ol{margin:0 0 8px;padding-left:20px;font-size:15px}
.build ol li{padding:1px 0}
.build .ru,.build .tp{margin:0 0 6px;font-size:14px;color:var(--mute)}
.build .ru b,.build .tp b{color:var(--ink);font-weight:600}
.build .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.build .ok{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#0b2228;cursor:pointer;font-weight:600;font-size:15px}
.build .ok input{width:20px;height:20px;accent-color:var(--c);margin:0}
.build .ok.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#0b2228)}
.build .ok.ro{cursor:default}
.build .other{font-size:14px}
</style>
</head>
<body>
<main class="band">
  <div class="top">
    <div>
      <h1>Ruleta de campeones</h1>
      <p class="sub">Facu, Jordy y Rexx: un tiro por turno, tres campeones para cada uno, filtrados por rol. Elegí el tuyo y animate a la build rara.</p>
    </div>
    <div class="roombar">
      <label for="code">Sala</label>
      <input id="code" autocomplete="off" spellcheck="false">
      <button id="enter">Entrar</button>
      <button id="copy">Copiar link</button>
      <span class="status"><span class="dot" id="dot"></span><span id="stxt">Conectando…</span></span>
    </div>
  </div>

  <div class="claimbar" id="claimbar"></div>

  <section class="seats" id="seats"></section>

  <div class="panel" id="panel" aria-live="polite"></div>
  <div id="msg" role="status" aria-live="polite" style="text-align:center;min-height:1.5em;color:var(--mute)"></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const socket=io();
const NAMES={1:"Facu",2:"Jordy",3:"Rexx"};
const ROLES=[["any","Cualquiera"],["top","Top"],["jg","Jungla"],["mid","Mid"],["adc","ADC"],["sup","Support"]];
let CHAMPS=["Ahri","Garen","Jinx","Lux","Yasuo","Thresh"];
let state=null, result=null, rolling=false;
const timers=[];

$("seats").innerHTML=[1,2,3].map(s=>`
<article class="seat" data-s="${s}">
  <header><span class="num">${s}</span><div><div class="who">${NAMES[s]}</div><div class="tag"><span class="online"></span><span class="st">Desconectado</span></div></div></header>
  <div class="rolerow"><label for="role${s}">Rol</label><select id="role${s}" class="role" data-s="${s}" disabled>${ROLES.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select></div>
  <ol class="reels">${[0,1,2].map(i=>`<li><button class="slot empty" data-s="${s}" data-i="${i}"><span class="nm">—</span><span class="mk">Juego con este</span></button></li>`).join('')}</ol>
  <div class="build" hidden>
    <h3></h3><p class="bk"></p><p class="note"></p><ol></ol>
    <p class="ru"></p><p class="tp"></p>
    <div class="acts"><label class="ok"><input type="checkbox" class="acc" data-s="${s}"><span class="okt">Me la juego con esta build</span></label><button class="other" data-s="${s}">Otra build rara</button></div>
  </div>
</article>`).join('');
const seatEl=s=>document.querySelector(`.seat[data-s="${s}"]`);
const slotEl=(s,i)=>document.querySelector(`.slot[data-s="${s}"][data-i="${i}"]`);
const rnd=n=>Math.floor(Math.random()*n);
const mySeat=()=>state?[1,2,3].find(s=>state.seats[s]&&state.seats[s].id===socket.id)||null:null;
const list=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1];
const btn=(id,txt,cls="")=>`<button id="${id}" class="${cls}">${txt}</button>`;

function render(){
  const me=mySeat();
  // quién soy
  const cb=$("claimbar");
  if(!state){cb.innerHTML="";}
  else if(me){cb.innerHTML=`<span class="tag">Estás como <b>${NAMES[me]}</b></span>${btn("release","Cambiar de jugador")}`;}
  else{
    cb.innerHTML=`<span class="tag">¿Quién sos?</span>`+[1,2,3].map(s=>`<button class="claim" data-s="${s}" ${state.seats[s]?"disabled":""}>Soy ${NAMES[s]}</button>`).join("");
  }
  // tarjetas
  for(const s of [1,2,3]){
    const el=seatEl(s), o=state&&state.seats[s], mine=me===s;
    el.classList.toggle("mine",mine);
    el.classList.toggle("on",!!o);
    el.classList.toggle("turn",!!state&&state.turn===s);
    el.querySelector(".st").textContent=mine?"Vos":o?"Conectado":"Desconectado";
    const sel=el.querySelector(".role");
    sel.disabled=!mine;
    if(document.activeElement!==sel) sel.value=state?state.roles[s]:"any";
    renderBuild(s,el,mine);
    for(const i of [0,1,2]){
      const b=slotEl(s,i), on=!rolling&&!!result&&state.picks[s]===i;
      b.classList.toggle("picked",on);
      b.setAttribute("aria-pressed",String(on));
    }
  }
  renderPanel(me);
}

function renderBuild(s,el,mine){
  const box=el.querySelector(".build"), w=state&&!rolling&&state.weird[s];
  box.hidden=!w;
  if(!w) return;
  box.querySelector("h3").textContent=`Build rara: ${w.name}`;
  box.querySelector(".bk").textContent=`para ${w.champ}`;
  const note=box.querySelector(".note"); note.textContent=w.note||""; note.hidden=!w.note;
  const ol=box.querySelector("ol"); ol.textContent="";
  for(const it of w.items){const li=document.createElement("li");li.textContent=it;ol.appendChild(li)}
  box.querySelector(".ru").innerHTML="<b>Runas:</b> "; box.querySelector(".ru").append(w.runes);
  box.querySelector(".tp").innerHTML="<b>Cómo jugarla:</b> "; box.querySelector(".tp").append(w.tip);
  const acc=box.querySelector(".acc"), lab=box.querySelector(".ok");
  acc.checked=!!w.accepted; acc.disabled=!mine;
  lab.classList.toggle("done",!!w.accepted); lab.classList.toggle("ro",!mine);
  box.querySelector(".okt").textContent=mine?(w.accepted?"Build rara confirmada":"Me la juego con esta build"):(w.accepted?`${NAMES[s]} confirmó la build rara`:`${NAMES[s]} todavía no confirmó`);
  const oth=box.querySelector(".other"); oth.hidden=!mine||w.accepted||w.options<2;
}

function renderPanel(me){
  const p=$("panel");
  if(!state){p.innerHTML=`<p class="small">Conectando con el servidor…</p>`;return}
  const turn=state.turn, req=state.request;
  const roundTxt=state.round?`<span class="round">Tiro n.º ${state.round}${result&&result.by?` · lo tiró ${NAMES[result.by]}`:""}</span>`:"";
  if(rolling){p.innerHTML=`<p class="big">Girando…</p>`;return}
  if(req){
    const asker=NAMES[req.seat], waiting=req.waiting.map(s=>NAMES[s]);
    if(me===req.seat){
      p.innerHTML=`<p class="big">Esperando que confirmen ${list(waiting)||"los demás"}</p><div class="row">${btn("cancel","Cancelar pedido")}</div>${roundTxt}`;
    }else if(me&&req.waiting.includes(me)){
      p.innerHTML=`<p class="big">${asker} quiere tirar la ruleta</p><p class="small">El tiro es para los tres.</p><div class="row">${btn("yes","Confirmar","yes")}${btn("no","Rechazar","no")}</div>${roundTxt}`;
    }else{
      const ok=req.approvals.map(s=>NAMES[s]);
      p.innerHTML=`<p class="big">${asker} pidió tirar</p><p class="small">${ok.length?`Ya confirmó ${list(ok)}. `:""}Falta ${list(waiting)}.</p>${roundTxt}`;
    }
    return;
  }
  if(!me){p.innerHTML=`<p class="big">Le toca a ${NAMES[turn]}</p><p class="small">Elegí quién sos arriba para jugar.</p>${roundTxt}`;return}
  if(me===turn){
    const others=[1,2,3].filter(s=>s!==me&&state.seats[s]);
    p.innerHTML=`<p class="big">Te toca tirar</p>${btn("spin","Pedir tirar la ruleta")}<p class="small">${others.length?`Lo tienen que confirmar ${list(others.map(s=>NAMES[s]))}.`:"Esperando que se conecte otro jugador para confirmar."}</p>${roundTxt}`;
    $("spin").disabled=!others.length;
    return;
  }
  const online=s=>!!state.seats[s];
  let nx=turn; for(let k=1;k<=3;k++){const n=((turn-1+k)%3)+1;if(online(n)){nx=n;break}}
  const away=online(turn)?"":` (si no vuelve en unos segundos, pasa el turno)`;
  p.innerHTML=`<p class="big">Le toca tirar a ${NAMES[turn]}</p><p class="small">${online(turn)?"":`${NAMES[turn]} no está conectado${away}. `}${nx===me?"Después te toca a vos.":`Después le toca a ${NAMES[nx]}.`}</p>${roundTxt}`;
}

function showResult(r,animate){
  timers.splice(0).forEach(clearTimeout);
  result=r;
  const slots=[];
  for(const s of [1,2,3]) for(const i of [0,1,2]) slots.push([s,i]);
  if(!r){slots.forEach(([s,i])=>{const b=slotEl(s,i);b.className="slot empty";b.querySelector(".nm").textContent="—"});rolling=false;render();return}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!animate||reduce){slots.forEach(([s,i])=>land(s,i,r.seats[s][i]));rolling=false;render();return}
  rolling=true; render();
  slots.forEach(([s,i],k)=>{
    const b=slotEl(s,i), nm=b.querySelector(".nm");
    b.classList.remove("empty","land","picked"); b.classList.add("rolling");
    const stopAt=performance.now()+700+k*170;
    const tick=()=>{
      const left=stopAt-performance.now();
      if(left<=0){land(s,i,r.seats[s][i]);if(k===slots.length-1){rolling=false;render()}return}
      nm.textContent=CHAMPS[rnd(CHAMPS.length)];
      timers.push(setTimeout(tick,Math.max(45,140-left/12)));
    };
    tick();
  });
}
function land(s,i,name){
  const b=slotEl(s,i);
  b.classList.remove("rolling","empty","land"); void b.offsetWidth; b.classList.add("land");
  b.querySelector(".nm").textContent=String(name);
}
function say(t,warn,ms=3500){
  const m=$("msg"); m.textContent=t; m.style.color=warn?"var(--p2)":"var(--mute)";
  clearTimeout(say.t); say.t=setTimeout(()=>{m.textContent=""},ms);
}

// clics
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.classList.contains("claim")){const s=+t.dataset.s;store.set("ruleta.seat",String(s));socket.emit("claim",s);return}
  if(t.id==="release"){store.set("ruleta.seat",null);socket.emit("release");return}
  if(t.id==="spin"){socket.emit("request");return}
  if(t.id==="cancel"){socket.emit("cancel");return}
  if(t.id==="yes"){t.disabled=true;socket.emit("respond",true);return}
  if(t.id==="no"){socket.emit("respond",false);return}
  if(t.classList.contains("other")){socket.emit("weird-other");return}
  if(t.classList.contains("slot")&&result&&!rolling&&+t.dataset.s===mySeat()){
    const i=+t.dataset.i, cur=state.picks[mySeat()];
    socket.emit("pick",cur===i?null:i);
  }
});

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.classList.contains("role")&&+t.dataset.s===mySeat()){socket.emit("role",t.value);return}
  if(t.classList.contains("acc")&&+t.dataset.s===mySeat()){socket.emit("weird-accept",t.checked)}
});

// sala
const clean=v=>v.toLowerCase().replace(/[^a-z0-9-]/g,"").replace(/^-+/,"").slice(0,40);
let code=clean(location.hash.slice(1));
if(!code){code="sala-"+Math.random().toString(36).slice(2,7);history.replaceState(null,"","#"+code)}
$("code").value=code;
let autoClaimed=false;
const join=()=>{result=null;state=null;autoClaimed=false;showResult(null);socket.emit("join",{code})};
$("enter").addEventListener("click",()=>{const c=clean($("code").value);if(c&&c!==code){code=c;$("code").value=c;location.hash=c;join()}});
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")$("enter").click()});
window.addEventListener("hashchange",()=>{const c=clean(location.hash.slice(1));if(c&&c!==code){code=c;$("code").value=c;join()}});
$("copy").addEventListener("click",()=>{
  const link=location.href.split("#")[0]+"#"+code;
  navigator.clipboard.writeText(link).then(()=>say("Link copiado. Pasáselo a los chicos."),()=>say("Link: "+link,false,8000));
});

// tiempo real
const setStatus=on=>{$("dot").classList.toggle("on",on);$("stxt").textContent=on?"En vivo":"Reconectando…"};
socket.on("connect",()=>{setStatus(true);join()});
socket.on("disconnect",()=>setStatus(false));
socket.on("champs",c=>{if(Array.isArray(c)&&c.length)CHAMPS=c.map(String)});
socket.on("state",st=>{
  if(!st) return;
  state=st;
  // volver a entrar como el mismo jugador después de recargar o reconectar
  if(!autoClaimed){autoClaimed=true;const s=+store.get("ruleta.seat");if([1,2,3].includes(s)&&!st.seats[s]&&!mySeat())socket.emit("claim",s)}
  if(!rolling&&(st.result?.e!==result?.e)) showResult(st.result,false);
  render();
});
socket.on("spun",r=>{showResult(r,true);say(`${NAMES[r.by]} tiró la ruleta`,false,2600)});
socket.on("notice",t=>say(String(t),true,4500));
render();
}
</script>
</body>
</html>
